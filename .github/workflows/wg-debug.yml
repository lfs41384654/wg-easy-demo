name: wg-debug

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: diag
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools iptables jq
          for m in wireguard ip_tables iptable_nat iptable_filter xt_nat xt_MASQUERADE xt_conntrack nf_nat; do sudo modprobe $m 2>/dev/null || true; done
          sudo docker pull -q ghcr.io/wg-easy/wg-easy:14
          echo "##### container A: privileged only"
          sudo docker run -d --name A --privileged ghcr.io/wg-easy/wg-easy:14 sleep 600 >/dev/null
          sleep 5
          echo "--- id ---";        sudo docker exec A id
          echo "--- readlink ls ---"; sudo docker exec A ls -l /usr/bin/readlink /bin/readlink 2>&1
          echo "--- readlink run ---"; sudo docker exec A /usr/bin/readlink -f / 2>&1; echo "rc=$?"
          echo "--- busybox ---"; sudo docker exec A /bin/busybox readlink -f / 2>&1; echo "rc=$?"
          echo "--- iptables ---"; sudo docker exec A iptables -V 2>&1; sudo docker exec A iptables -t nat -L -n 2>&1 | head -5
          echo "--- ip link add test ---"; sudo docker exec A ip link add wgtest type wireguard 2>&1; echo "rc=$?"
          echo "--- wg-quick up manual ---"
          sudo docker exec A sh -c 'mkdir -p /etc/wireguard && printf "[Interface]\nAddress = 10.8.0.1/24\nListenPort = 51820\nPrivateKey = %s\n" "$(wg genkey)" > /etc/wireguard/wg0.conf && wg-quick up wg0' 2>&1 | tail -15
          echo "--- wg show ---"; sudo docker exec A wg show 2>&1 | head
          echo "--- apparmor ---"; cat /sys/module/apparmor/parameters/enabled 2>&1; sudo aa-status 2>&1 | head -3
          echo "--- host kernel ---"; uname -r; ls /lib/modules
          sudo docker rm -f A >/dev/null 2>&1

      - name: diag2 non-priv
        run: |
          echo "##### container B: caps + NET_ADMIN, no readlink issue check"
          sudo docker run -d --name B \
            --cap-add=NET_ADMIN --cap-add=SYS_MODULE \
            --sysctl="net.ipv4.conf.all.src_valid_mark=1" \
            --sysctl="net.ipv4.ip_forward=1" \
            ghcr.io/wg-easy/wg-easy:14 sleep 600 >/dev/null
          sleep 5
          sudo docker exec B sh -c 'mkdir -p /etc/wireguard && printf "[Interface]\nAddress = 10.8.0.1/24\nListenPort = 51820\nPrivateKey = %s\n" "$(wg genkey)" > /etc/wireguard/wg0.conf && wg-quick up wg0' 2>&1 | tail -15
          echo "--- wg show ---"; sudo docker exec B wg show 2>&1 | head
          sudo docker rm -f B >/dev/null 2>&1