name: wg-diag5

on:
  workflow_dispatch:

jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: build shim image
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools jq >/dev/null 2>&1
          sudo modprobe wireguard
          sudo mkdir -p /etc/wireguard
          sudo sh -c 'umask 077; wg genkey > /etc/wireguard/server.key'
          sudo sh -c 'printf "[Interface]\nAddress = 10.8.0.1/24\nListenPort = 51820\nMTU = 1280\nPrivateKey = %s\n" "$(cat /etc/wireguard/server.key)" > /etc/wireguard/wg0.conf'
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          sudo wg show | head -3
          sudo docker pull -q ghcr.io/wg-easy/wg-easy:14 >/dev/null
          docker rm -f base >/dev/null 2>&1 || true
          docker run -d --name base --privileged --entrypoint sh ghcr.io/wg-easy/wg-easy:14 -c 'sleep 180' >/dev/null
          sleep 3
          docker cp base:/usr/bin/wg-quick /tmp/wq.real
          sed -i 's|^SELF=.*readlink.*$|SELF="/usr/bin/wg-quick.real"|' /tmp/wq.real
          sed -i '/stat -c/ s|^.*$|\t: # removed|' /tmp/wq.real
          sed -i 's|^\([ \t]*\)CONFIG_FILE="\$(readlink -f "\(\$CONFIG_FILE\)")"|\1CONFIG_FILE="\2"|' /tmp/wq.real
          echo "leftover=$(grep -c 'readlink\|stat -c' /tmp/wq.real || true)"
          docker cp /tmp/wq.real base:/usr/bin/wg-quick.real
          docker cp scripts/wg-quick-shim.sh base:/usr/bin/wg-quick
          docker exec base chmod 755 /usr/bin/wg-quick.real /usr/bin/wg-quick
          docker commit base wgshim:1 >/dev/null
          docker rm -f base >/dev/null 2>&1
          echo BUILD_OK

      - name: A. host netns foreground run
        run: |
          set +e
          PW=DemoWG2026
          HASH=$(sudo docker run --rm --entrypoint node wgshim:1 -e "console.log(require('bcryptjs').hashSync(process.argv[1],10))" "$PW")
          echo "=== foreground (10s) ==="
          sudo timeout 12 docker run --name wgA --privileged --network=host \
            -v /etc/wireguard:/etc/wireguard \
            -e "WG_HOST=test.example.com" -e "PASSWORD_HASH=$HASH" \
            -e WG_PORT=51820 -e WG_DEFAULT_DNS=1.1.1.1 -e WG_MTU=1280 \
            wgshim:1 2>&1 | head -40
          echo "=== inspect ==="
          sudo docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}} err={{.State.Error}}' wgA
          sudo docker logs wgA 2>&1 | head -20
          sudo docker rm -f wgA >/dev/null 2>&1

      - name: B. bridge netns foreground run
        run: |
          set +e
          PW=DemoWG2026
          HASH=$(sudo docker run --rm --entrypoint node wgshim:1 -e "console.log(require('bcryptjs').hashSync(process.argv[1],10))" "$PW")
          echo "=== bridge net (10s) ==="
          sudo timeout 12 docker run --name wgB --privileged \
            -v /etc/wireguard:/etc/wireguard \
            -e "WG_HOST=test.example.com" -e "PASSWORD_HASH=$HASH" \
            -e WG_DEFAULT_DNS=1.1.1.1 -e WG_MTU=1280 \
            -p 51821:51821/tcp wgshim:1 2>&1 | head -40
          sudo docker rm -f wgB >/dev/null 2>&1
          echo DIAG5_DONE