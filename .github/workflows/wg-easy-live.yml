name: wg-easy-live

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'keep alive minutes'
        required: true
        default: '25'

jobs:
  up:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: setup host wireguard
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools iptables jq curl
          sudo modprobe wireguard && lsmod | grep -i wireguard
          for m in ip_tables iptable_nat iptable_filter xt_nat xt_MASQUERADE xt_conntrack nf_nat; do
            sudo modprobe "$m" 2>/dev/null || true
          done
          sudo curl -sL -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version
          sudo docker pull -q ghcr.io/wg-easy/wg-easy:14

      - name: preflight wg0 on host
        run: |
          set -e
          sudo mkdir -p /etc/wireguard
          sudo sh -c 'umask 077; wg genkey > /etc/wireguard/server.key'
          sudo sh -c 'printf "[Interface]\nAddress = 10.8.0.1/24\nListenPort = 51820\nMTU = 1280\nPrivateKey = %s\n" "$(cat /etc/wireguard/server.key)" > /etc/wireguard/wg0.conf'
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          echo "=== host wg0 ==="
          sudo wg show
          sudo ip -brief addr show wg0
          echo PREFLIGHT_OK

      - name: open public tunnel
        run: |
          set -e
          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:51821 > /tmp/cf.log 2>&1 &
          URL=""
          for i in $(seq 1 40); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          [ -n "$URL" ] || { echo TUNNEL_FAIL; cat /tmp/cf.log; exit 1; }
          HOST=${URL#https://}
          echo "TUNNEL_URL=$URL" >> "$GITHUB_ENV"
          echo "WG_HOST=$HOST" >> "$GITHUB_ENV"
          echo "public url: $URL"

      - name: build shim image
        run: |
          set -e
          docker rm -f base >/dev/null 2>&1 || true
          docker run -d --name base --privileged --entrypoint sh ghcr.io/wg-easy/wg-easy:14 -c 'sleep 180' >/dev/null
          sleep 3
          docker cp base:/usr/bin/wg-quick /tmp/wq.real
          sed -i 's|^SELF=.*readlink.*$|SELF="/usr/bin/wg-quick.real"|' /tmp/wq.real
          sed -i 's|^[ \t]*CONFIG_FILE="$(\readlink -f "\$CONFIG_FILE")"[ \t]*$|\tCONFIG_FILE="$CONFIG_FILE"|' /tmp/wq.real
          sed -i '/stat -c/ s|^.*$|\t: # perm check removed|' /tmp/wq.real
          echo "leftover refs: $(grep -c 'readlink\|stat -c' /tmp/wq.real || true)"
          docker cp /tmp/wq.real base:/usr/bin/wg-quick.real
          docker cp scripts/wg-quick-shim.sh base:/usr/bin/wg-quick
          docker exec base chmod 755 /usr/bin/wg-quick.real /usr/bin/wg-quick
          echo "--- strip test ---"
          docker exec base /usr/bin/wg-quick.real strip wg0 2>&1 | head -4 || true
          docker commit base wgshim:1 >/dev/null && echo "image committed"
          docker rm -f base >/dev/null 2>&1

      - name: run wg-easy with host netns
        run: |
          set -e
          PW='DemoWG2026'
          echo "WG_UI_PASSWORD=$PW" >> "$GITHUB_ENV"
          HASH=$(sudo docker run --rm --entrypoint node wgshim:1 \
                 -e "console.log(require('bcryptjs').hashSync(process.argv[1],10))" "$PW")
          echo "hash len ${#HASH}"
          sudo docker rm -f wg-easy >/dev/null 2>&1 || true
          sudo docker run -d --name wg-easy --privileged --network=host \
            -v /etc/wireguard:/etc/wireguard \
            -e "WG_HOST=$WG_HOST" \
            -e "PASSWORD_HASH=$HASH" \
            -e WG_PORT=51820 \
            -e WG_DEFAULT_ADDRESS=10.8.0.x \
            -e WG_DEFAULT_DNS=1.1.1.1 \
            -e WG_ALLOWED_IPS=0.0.0.0/0,::/0 \
            -e WG_MTU=1280 \
            wgshim:1
          ok=0
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:51821/ || true)
            echo "probe $i -> $code"
            [ "$code" = "200" ] && { ok=1; break; }
            sleep 3
          done
          echo "=== container logs ==="; sudo docker logs wg-easy 2>&1 | tail -20
          echo "=== host wg show ==="; sudo wg show 2>&1 | head -12
          [ "$ok" = "1" ] || { echo WG_EASY_HTTP_FAIL; exit 1; }
          echo WG_EASY_UP

      - name: create client through web API
        run: |
          set -e
          BASE=http://127.0.0.1:51821
          J=/tmp/cj.txt
          curl -s -c $J -X POST "$BASE/api/session" -H 'Content-Type: application/json' \
            -d "{\"password\":\"$WG_UI_PASSWORD\"}" -o /tmp/login.json -w 'login http=%{http_code}\n'
          head -c 120 /tmp/login.json; echo
          curl -s -b $J -X POST "$BASE/api/wireguard/client" -H 'Content-Type: application/json' \
            -d '{"name":"demo-phone"}' -o /tmp/client.json -w 'create http=%{http_code}\n'
          head -c 200 /tmp/client.json; echo
          CID=$(jq -r '.id' /tmp/client.json)
          curl -s -b $J "$BASE/api/wireguard/client/$CID/configuration" -o /tmp/demo-phone.conf
          echo "===== CLIENT CONFIG ====="
          cat /tmp/demo-phone.conf
          echo "===== END ====="
          echo "--- peers on host ---"; sudo wg show 2>&1 | head -20
          echo "--- nat rules ---"; sudo iptables -t nat -S POSTROUTING 2>&1 | head -5

      - name: keep alive + summary
        run: |
          {
            echo "## wg-easy 演示实例已就绪"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| **Web UI** | $TUNNEL_URL |"
            echo "| 密码 | $WG_UI_PASSWORD |"
            echo "| WG_HOST | $WG_HOST |"
            echo "| 保活 | ${{ github.event.inputs.minutes }} 分钟 |"
            echo ""
            echo "### demo-phone 客户端配置"
            echo '```'
            cat /tmp/demo-phone.conf 2>/dev/null || echo "(未生成)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "UI: $TUNNEL_URL  pw: $WG_UI_PASSWORD"
          H=${{ github.event.inputs.minutes }}
          for m in $(seq 1 "$H"); do
            sleep 60
            if [ $((m % 5)) = 0 ]; then echo "[${m}/${H}min]"; sudo wg show 2>&1 | head -8; fi
          done

      - name: upload config
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wg-client-config
          path: /tmp/demo-phone.conf
          if-no-files-found: ignore